<svg viewBox="0 0 760 120" role="img" aria-labelledby="ff-title ff-desc">
  <title id="ff-title">FPGA design flow</title>
  <desc id="ff-desc">Each lab moves from specification to Verilog RTL, to testbench simulation, to synthesis and implementation with XDC pin constraints, to verification on the Basys 3 board.</desc>
  <defs>
    <marker id="ff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="d-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="d-box" x="10" y="30" width="118" height="56" rx="4"/>
  <text class="d-text" x="69" y="63" text-anchor="middle">Specification</text>
  <rect class="d-box" x="164" y="30" width="118" height="56" rx="4"/>
  <text class="d-text" x="223" y="54" text-anchor="middle">Verilog RTL</text>
  <text class="d-small" x="223" y="72" text-anchor="middle">module design</text>
  <rect class="d-core" x="318" y="30" width="118" height="56" rx="4"/>
  <text class="d-text" x="377" y="54" text-anchor="middle">Simulation</text>
  <text class="d-small" x="377" y="72" text-anchor="middle">exhaustive testbench</text>
  <rect class="d-box" x="472" y="30" width="118" height="56" rx="4"/>
  <text class="d-text" x="531" y="54" text-anchor="middle">Synthesis</text>
  <text class="d-small" x="531" y="72" text-anchor="middle">+ XDC pin map</text>
  <rect class="d-box" x="626" y="30" width="124" height="56" rx="4"/>
  <text class="d-text" x="688" y="54" text-anchor="middle">Basys 3 board</text>
  <text class="d-small" x="688" y="72" text-anchor="middle">on-board check</text>
  <path class="d-wire" d="M128,58 H162" marker-end="url(#ff-arrow)"/>
  <path class="d-wire" d="M282,58 H316" marker-end="url(#ff-arrow)"/>
  <path class="d-wire" d="M436,58 H470" marker-end="url(#ff-arrow)"/>
  <path class="d-wire" d="M590,58 H624" marker-end="url(#ff-arrow)"/>
</svg>
